#cloud-config
# First boot of the demo VM (infra/main.bicep): Docker Engine + compose plugin, the deploy directory.
package_update: true
packages: [ca-certificates, curl, git]
runcmd:
  - curl -fsSL https://get.docker.com | sh
  - usermod -aG docker kvdemo
  - mkdir -p /opt/kv && chown kvdemo:kvdemo /opt/kv
  - systemctl enable --now docker
